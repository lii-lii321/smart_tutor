server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # CSP 观察期（PLAN P2-8）：只上报不拦截，允许 AMap 外链/worker 与 Vant 内联样式过渡。
    # 观察 report-uri 一周无意外违规后收紧为 Content-Security-Policy 强制。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://webapi.amap.com https://restapi.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.amap.com https://webapi.amap.com; connect-src 'self' https://restapi.amap.com https://api.deepseek.com; worker-src 'self' blob: https://webapi.amap.com; font-src 'self' data:; frame-ancestors 'self'; report-uri /csp-report;" always;
    location = /csp-report {
        # 上报端点：返回 204，由 nginx access log 按 4xx/POST 特征检索违规样本
        return 204;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 前端 SPA 路由：HTML 不缓存，发版后立即引用新 assets（assets 本身 immutable）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 接入 HTTPS 终结时后端能正确识别协议
        proxy_set_header X-Forwarded-Proto $scheme;
        # 批量导入的微信原文可能较大，默认 1m 不够
        client_max_body_size 10m;
        # AI 解析请求耗时较长
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # 静态资源缓存（带 hash 的 assets）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
