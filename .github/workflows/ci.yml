name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify alembic migration chain
        env:
          DEV_MODE: "true"
          AUTO_CREATE_SCHEMA: "false"
          DATABASE_URL: sqlite:///./ci_migration.db
          JWT_SECRET: ci-secret-for-github-actions-0123456789
        run: |
          # 迁移链分叉/SQLite 不兼容的变更在此直接失败，不上线才暴露
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        env:
          # 测试套件自带临时 SQLite 与假密钥，这里仅兜底
          JWT_SECRET: ci-secret-for-github-actions-0123456789
          OWNER_ACCESS_CODE: ci-boss-code
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build
