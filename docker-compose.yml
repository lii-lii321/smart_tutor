services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smart_tutor}
      # 与 api 的 DATABASE_URL 保持同一账号，MySQL 镜像会据此自动建用户并授权
      MYSQL_USER: ${DB_USER:-smart_tutor}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_TIMEZONE: +00:00
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    # 显式镜像名：本地构建可推 tag，发布流程（semver tag → build → push）的前置
    image: smart-tutor/api:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER:-smart_tutor}:${DB_PASSWORD}@db:3306/${DB_NAME:-smart_tutor}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      OWNER_ACCESS_CODE: ${OWNER_ACCESS_CODE}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AMAP_API_KEY: ${AMAP_API_KEY}
      # Sentry 错误上报：留空则完全不启用（P1-9）
      SENTRY_DSN: ${SENTRY_DSN:-}
      # 生产严禁开启 DEV_MODE / AUTO_CREATE_SCHEMA，建表一律走 alembic
      DEV_MODE: "false"
      AUTO_CREATE_SCHEMA: "false"
      ORDER_EXPIRE_HOURS: ${ORDER_EXPIRE_HOURS:-72}
      MAX_PARSE_PER_MINUTE: ${MAX_PARSE_PER_MINUTE:-20}
      MAX_LOGIN_PER_MINUTE: ${MAX_LOGIN_PER_MINUTE:-10}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # 调度由下方独立的 scheduler 容器承担，API 进程不再内嵌
      DISABLE_SCHEDULER: "true"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 独立调度容器：订单过期归档/临期提醒（与 api 同镜像，仅跑调度循环）
  scheduler:
    build: .
    image: smart-tutor/api:latest
    restart: unless-stopped
    command: python -m services.scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER:-smart_tutor}:${DB_PASSWORD}@db:3306/${DB_NAME:-smart_tutor}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ORDER_EXPIRE_HOURS: ${ORDER_EXPIRE_HOURS:-72}
      # 生产严禁开启 DEV_MODE / AUTO_CREATE_SCHEMA
      DEV_MODE: "false"
      AUTO_CREATE_SCHEMA: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: smart-tutor/web:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db_data:
  redis_data:
