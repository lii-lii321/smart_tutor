services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # root 密码与业务账号密码分离：DB_PASSWORD 泄露不再等于拿到 root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.production 中设置独立强随机的 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smart_tutor}
      # 与 api 的 DATABASE_URL 保持同一账号，MySQL 镜像会据此自动建用户并授权
      MYSQL_USER: ${DB_USER:-smart_tutor}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_TIMEZONE: +00:00
    # explicit-defaults-for-timestamp：关闭 MySQL 对"表内第一个无 DEFAULT 的 TIMESTAMP 列"
    # 的隐式 DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP——
    # 该隐式行为会把 orders.expired_at 在每次 UPDATE 时静默重置为 NOW()，活跃订单瞬间过期；
    # default-time-zone 固定在服务器层，不依赖 api 连接串的 init_command（换驱动不丢设置）
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit-defaults-for-timestamp=ON
      --default-time-zone=+00:00
    volumes:
      - db_data:/var/lib/mysql
    # 资源上限（目标机 2C4G）：MySQL 无内存上限时可吃满宿主引发 OOM 连坐
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 全部键均可由 DB 重建（限流计数/缓存/GEO），容量到顶按 LRU 淘汰优于写报错
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    # 显式镜像名：本地构建可推 tag，发布流程（semver tag → build → push）的前置
    image: smart-tutor/api:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER:-smart_tutor}:${DB_PASSWORD}@db:3306/${DB_NAME:-smart_tutor}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      OWNER_ACCESS_CODE: ${OWNER_ACCESS_CODE}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AMAP_API_KEY: ${AMAP_API_KEY}
      # Sentry 错误上报：留空则完全不启用（P1-9）
      SENTRY_DSN: ${SENTRY_DSN:-}
      # 触达通道（services/notify.py）：留空 = 仅站内信 + 日志兜底
      NOTIFY_WECOM_WEBHOOK_URL: ${NOTIFY_WECOM_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      # 收款凭证存储目录（与下方 receipt_data 卷挂载点一致）
      RECEIPT_DIR: /app/data/receipts
      # 生产严禁开启 DEV_MODE / AUTO_CREATE_SCHEMA，建表一律走 alembic
      DEV_MODE: "false"
      AUTO_CREATE_SCHEMA: "false"
      ORDER_EXPIRE_HOURS: ${ORDER_EXPIRE_HOURS:-72}
      MAX_PARSE_PER_MINUTE: ${MAX_PARSE_PER_MINUTE:-20}
      MAX_LOGIN_PER_MINUTE: ${MAX_LOGIN_PER_MINUTE:-10}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 多 worker 下文件轮转非进程安全：容器内一律纯 stdout，由 docker json-file 收集
      LOG_TO_FILE: "false"
      # 调度由下方独立的 scheduler 容器承担，API 进程不再内嵌
      DISABLE_SCHEDULER: "true"
    volumes:
      # 收款凭证（转账截图）持久化：容器重建不丢凭证文件
      - receipt_data:/app/data/receipts
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 独立调度容器：订单过期归档/临期提醒（与 api 同镜像，仅跑调度循环）
  scheduler:
    build: .
    image: smart-tutor/api:latest
    restart: unless-stopped
    command: python -m services.scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER:-smart_tutor}:${DB_PASSWORD}@db:3306/${DB_NAME:-smart_tutor}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      # 生产红线校验（config.model_post_init）对所有进程生效：缺 OWNER_ACCESS_CODE 会导致
      # scheduler 启动即崩溃重启（2026-09 上线彩排实测抓出）
      OWNER_ACCESS_CODE: ${OWNER_ACCESS_CODE}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 与 api 同口径：纯 stdout，日志由 docker json-file 收集
      LOG_TO_FILE: "false"
      ORDER_EXPIRE_HOURS: ${ORDER_EXPIRE_HOURS:-72}
      # 生产严禁开启 DEV_MODE / AUTO_CREATE_SCHEMA
      DEV_MODE: "false"
      AUTO_CREATE_SCHEMA: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      # 触达通道：出站消息由本容器的调度循环投递，配置必须与 api 同源
      NOTIFY_WECOM_WEBHOOK_URL: ${NOTIFY_WECOM_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      NOTIFY_DISPATCH_INTERVAL: ${NOTIFY_DISPATCH_INTERVAL:-30}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
    # 心跳文件由调度循环每轮 touch（默认 300s 一次）；阈值 1200s 容忍偶发慢轮。
    # 用 python 探针而非 shell 算术：CMD-SHELL 的 $(()) 在镜像 dash 下展开不可靠（彩排实测）
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/tmp/scheduler.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 1200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: smart-tutor/web:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 每日自动备份到宿主机 ./backups（发版前仍按 DEPLOY.md §4.1 手动备份一次）
  db-backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      DB_USER: ${DB_USER:-smart_tutor}
      DB_NAME: ${DB_NAME:-smart_tutor}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    command: >
      sh -c 'while :; do
        ts=$$(date +%F-%H%M);
        if mysqldump -h db -u "$$DB_USER" --single-transaction --no-tablespaces "$$DB_NAME" > "/backups/smart_tutor_$$ts.sql"; then
          echo "backup ok: smart_tutor_$$ts.sql";
          rm -f /backups/BACKUP_FAILED;
          find /backups -name "smart_tutor_*.sql" -mtime +"$$BACKUP_RETENTION_DAYS" -delete;
        else
          rm -f "/backups/smart_tutor_$$ts.sql";
          touch /backups/BACKUP_FAILED;
          echo "ERROR: backup FAILED at $$ts — 保留历史备份未清理，请立即排查（磁盘满/密码轮换/库不可达）";
        fi;
        sleep 86400;
      done'
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m

volumes:
  db_data:
  redis_data:
  receipt_data:
