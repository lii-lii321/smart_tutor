services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # root 密码与业务账号密码分离：DB_PASSWORD 泄露不再等于拿到 root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.production 中设置独立强随机的 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smart_tutor}
      # 与 api 的 DATABASE_URL 保持同一账号，MySQL 镜像会据此自动建用户并授权
      MYSQL_USER: ${DB_USER:-smart_tutor}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_TIMEZONE: +00:00
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    # 显式镜像名：本地构建可推 tag，发布流程（semver tag → build → push）的前置
    image: smart-tutor/api:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER:-smart_tutor}:${DB_PASSWORD}@db:3306/${DB_NAME:-smart_tutor}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      OWNER_ACCESS_CODE: ${OWNER_ACCESS_CODE}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AMAP_API_KEY: ${AMAP_API_KEY}
      # Sentry 错误上报：留空则完全不启用（P1-9）
      SENTRY_DSN: ${SENTRY_DSN:-}
      # 生产严禁开启 DEV_MODE / AUTO_CREATE_SCHEMA，建表一律走 alembic
      DEV_MODE: "false"
      AUTO_CREATE_SCHEMA: "false"
      ORDER_EXPIRE_HOURS: ${ORDER_EXPIRE_HOURS:-72}
      MAX_PARSE_PER_MINUTE: ${MAX_PARSE_PER_MINUTE:-20}
      MAX_LOGIN_PER_MINUTE: ${MAX_LOGIN_PER_MINUTE:-10}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 调度由下方独立的 scheduler 容器承担，API 进程不再内嵌
      DISABLE_SCHEDULER: "true"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 独立调度容器：订单过期归档/临期提醒（与 api 同镜像，仅跑调度循环）
  scheduler:
    build: .
    image: smart-tutor/api:latest
    restart: unless-stopped
    command: python -m services.scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER:-smart_tutor}:${DB_PASSWORD}@db:3306/${DB_NAME:-smart_tutor}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ORDER_EXPIRE_HOURS: ${ORDER_EXPIRE_HOURS:-72}
      # 生产严禁开启 DEV_MODE / AUTO_CREATE_SCHEMA
      DEV_MODE: "false"
      AUTO_CREATE_SCHEMA: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 心跳文件由调度循环每轮 touch（默认 300s 一次）；阈值 1200s 容忍偶发慢轮
    healthcheck:
      test: ["CMD-SHELL", "test $$(date +%s) - $$(stat -c %Y /tmp/scheduler.heartbeat 2>/dev/null || echo 0) -lt 1200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: smart-tutor/web:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 每日自动备份到宿主机 ./backups（发版前仍按 DEPLOY.md §4.1 手动备份一次）
  db-backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      DB_USER: ${DB_USER:-smart_tutor}
      DB_NAME: ${DB_NAME:-smart_tutor}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    command: >
      sh -c 'while :; do
        ts=$$(date +%F-%H%M);
        if mysqldump -h db -u "$$DB_USER" --single-transaction "$$DB_NAME" > "/backups/smart_tutor_$$ts.sql"; then
          echo "backup ok: smart_tutor_$$ts.sql";
        else
          echo "backup FAILED: $$ts";
        fi;
        find /backups -name "smart_tutor_*.sql" -mtime +"$$BACKUP_RETENTION_DAYS" -delete;
        sleep 86400;
      done'

volumes:
  db_data:
  redis_data:
