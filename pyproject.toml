[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".scratch", "deploy", "docs", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    # 全库存 naive UTC 是既定约定（MySQL 会话时区固定 +00:00，读取按 UTC 解释），见 middleware/auth.py 注释
    "DTZ",
    # 降级路径的 except Exception 是刻意的（Redis 不可用/调度容错），均有注释
    "BLE",
    # CSV/文件处理的 with 改造属重构范畴，不属于 lint 清理
    "SIM115",
    # 存量行距 100 的长行较多，格式化属单独一轮（ruff format），不在 lint 阻塞范围
    "E501",
    # try/except-pass → contextlib.suppress 属大范围风格改造，30+ 处，后续单独清
    "SIM105",
    # (str, Enum) → StrEnum 涉及 SQLAlchemy/序列化路径，需专门回归，不交由 lint 驱动
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的惯用法：默认参数里调用 Depends() 与项目守卫工厂，不是可变默认值问题
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "middleware.auth.require_role",
    "middleware.auth.require_tenant_owner",
]

[tool.ruff.lint.per-file-ignores]
# Alembic 生成模板沿用 typing.Union 写法，不强制现代化
"alembic/versions/*" = ["UP007", "UP035"]
"tests/*" = ["B008", "SIM117", "B011", "E702", "F841", "B007"]
# main.py 在 app 创建后集中注册路由，属刻意的导入顺序
"main.py" = ["E402"]
# 一次性运维脚本，未使用变量多为占位观测
"scripts/*" = ["F841", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# SQLAlchemy asyncio 门面经 greenlet 驱动同步内核：不声明 greenlet 时
# 路由 handler 在首个 DB await 之后的行全部漏计（覆盖率假性偏低）
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# 2026-09-18 实测基线 90%（routers/services/middleware/models/utils，
# 3810 语句）；阈值留 2pt 缓冲防环境波动，抬升只允许靠补测试
fail_under = 88

[tool.mypy]
# 目标：services/routers/middleware/models/database（config.py 经 import 跟踪覆盖）
# models 已迁 SQLAlchemy 2.0 Mapped[] 声明（2026-09-18），实例属性类型真实化后
# mypy 才有信号（迁移前 226 错误里约 95% 是 Column[X] 噪音）；当前 0 错误，回归即拦
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# 宽松起步：DB 层可空列（如 status/weekly_frequency 带 default 但未显式 NOT NULL）
# 的 Optional 流转收窄属后续专项，避免门禁一刀切阻断资金路径改造
strict_optional = false
files = ["services", "routers", "middleware", "models", "database.py"]
